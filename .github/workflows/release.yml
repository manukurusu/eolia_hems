name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MANIFEST: custom_components/eolia_hems/manifest.json
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Set manifest version
        run: |
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > manifest.tmp
          mv manifest.tmp "$MANIFEST"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"

      - name: Zip integration
        run: cd custom_components/eolia_hems && zip -r ../../eolia_hems.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" eolia_hems.zip --generate-notes
